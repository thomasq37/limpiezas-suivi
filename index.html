<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F4E78">
<title>Limpiezas · Fenals & Caprabo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧽</text></svg>">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Limpiezas</h1>
      <div class="sub" id="updated">Cargando…</div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Actualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>
  <main id="app">
    <div class="skeleton"></div><div class="skeleton" style="height:80px"></div>
  </main>
  <footer>Si ves algo que no cuadra, avísame 🙂</footer>
</div>
<dialog id="sheet" aria-label="Limpieza"></dialog>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div id="toast" class="toast" role="alert" aria-live="assertive"></div>

</body>
</html>
